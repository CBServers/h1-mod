name: Build

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
    types: [opened, synchronize, reopened]
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build binaries
    runs-on: windows-2022
    strategy:
      matrix:
        configuration:
          #- Debug
          - Release
    steps:
      - name: Set Git to use LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out files
        uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0
          # NOTE - If LFS ever starts getting used during builds, switch this to true!
          lfs: false

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1.3

      - name: Generate project files
        run: tools/premake5 vs2022

      - name: Set up problem matching
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Build ${{matrix.configuration}} binaries
        run: msbuild /m /v:minimal /p:Configuration=${{matrix.configuration}} /p:Platform=x64 build/h1-mod.sln

      - name: Upload ${{matrix.configuration}} Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.configuration}} Binary
          path: |
            build/bin/x64/${{matrix.configuration}}/${{ matrix.configuration == 'Debug' && 'h1-mod_dev.exe' || 'h1-mod.exe' }}
          #  build/bin/x64/${{matrix.configuration}}/${{ matrix.configuration == 'Debug' && 'h1-mod_dev.pdb' || 'h1-mod.pdb' }}
            
      - name: Upload ${{matrix.configuration}} data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.configuration}} data artifacts
          path: |
            data/cdata/*

  deploy:
    name: Deploy artifacts
    needs: build
    runs-on: windows-2022
    if: github.repository_owner == 'CBServers' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Set Git to use LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          
      - name: Download Release binaries
        uses: actions/download-artifact@v4.1.8
        with:
          name: Release Binary

      - name: Download Release data artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          name: Release data artifacts
          path: cdata

      - name: Download hashing executable
        run: |
          Invoke-WebRequest -Uri "https://github.com/CBServers/updater/releases/download/v1.0.0/update-hasher.exe" -OutFile "update-hasher.exe"

      - name: Generate hashed.json
        run: |
          .\update-hasher.exe

      - name: Create folder structure and rename files
        run: |
          mkdir -p h1-mod/data
          mkdir -p h1-mod/data-dev

          Copy-Item -Path .\cdata -Destination .\h1-mod\data\ -Recurse -Force
          Copy-Item -Path .\cdata -Destination .\h1-mod\data-dev\ -Recurse -Force
          
          Copy-Item -Path .\h1-mod.exe -Destination .\h1-mod\data\
          Copy-Item -Path .\h1-mod.exe -Destination .\h1-mod\data-dev\
          
          Copy-Item -Path .\hashed.json -Destination .\h1-mod\files.json
          Copy-Item -Path .\hashed.json -Destination .\h1-mod\files-dev.json

      - name: Clone updater
        run: |
          git config --global user.name 'CBServers'
          git config --global user.email '${{ secrets.OWNER_EMAIL }}'
          $env:GIT_TERMINAL_PROMPT=0
          $env:GIT_USERNAME="CBServers"
          $env:GIT_PASSWORD="${{ secrets.REPO_PAT }}"
          git clone https://$env:GIT_USERNAME:$env:GIT_PASSWORD@github.com/CBServers/updater.git

      - name: Copy files to updater and cleanup
        run: |
          if (-Not (Test-Path -Path ".\updater\updater\h1-mod")) {
            New-Item -Path ".\updater\updater\h1-mod" -ItemType Directory -Force
          }
            
          Copy-Item -Path .\h1-mod\* -Destination .\updater\updater\h1-mod\ -Recurse -Force
          
          Remove-Item -Path .\h1-mod -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path .\update-hasher.exe -Force -ErrorAction SilentlyContinue
          Remove-Item -Path .\hashed.json -Force -ErrorAction SilentlyContinue
          Remove-Item -Path .\cdata -Recurse -Force -ErrorAction SilentlyContinue

      - name: Push changes to updater
        run: |
          cd updater
          git add .
          git commit -m "Update artifacts"
          git push origin main